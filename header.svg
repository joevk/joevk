<svg
  width="854"
  height="130"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 854 130"
  role="img"
  aria-label="Profile Header Banner"
>
  <!--
    Unified GitHub Profile Header Banner
    Combines the animated fluid waving gradient background with the StackOverflow badge,
    the animated Fira Code typing banner, and the Total Contributions stats widget
    into a single cohesive banner.
  -->

  <defs>
    <!-- Teal-to-navy linear gradient matching capsule-render (idx: 2) -->
    <linearGradient id="waveLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43cea2"/>
      <stop offset="100%" stop-color="#185a9d"/>
    </linearGradient>

    <!-- Clip path to keep wave animation neatly inside the rounded container -->
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="854" height="130" rx="4"/>
    </clipPath>
  </defs>

  <style>
    .mono-text {
      font-family: "Fira Code", monospace, "Segoe UI", sans-serif;
      font-size: 16px;
      font-weight: 600;
      fill: #00FFFF;
      letter-spacing: 0.5px;
    }
    .stat-num {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
      font-size: 24px;
      font-weight: 700;
      fill: #FF007F;
    }
    .stat-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #FF007F;
    }
    .stat-range {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
      font-size: 9px;
      font-weight: 400;
      fill: #A9FEF7;
    }
  </style>

  <!-- Main Container -->
  <g clip-path="url(#bannerClip)">
    <!-- Base dark background matching GitHub Dark Theme -->
    <rect width="854" height="130" fill="#0D1117" />

    <!--
      Animated Waving Gradient Layer:
      Two overlapping fluid wave paths with smooth spline-interpolated motion (20s duration)
    -->
    <g opacity="0.85">
      <path fill="url(#waveLinear)" opacity="0.60">
        <animate
          attributeName="d"
          dur="20s"
          repeatCount="indefinite"
          keyTimes="0;0.333;0.667;1"
          calcmod="spline"
          keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
          begin="0s"
          values="M0 0 L 854 0 L 854 105 Q 640.5 70 427 100 T 0 85 Z; M0 0 L 854 0 L 854 80 Q 640.5 115 427 85 T 0 110 Z; M0 0 L 854 0 L 854 115 Q 640.5 85 427 115 T 0 90 Z; M0 0 L 854 0 L 854 105 Q 640.5 70 427 100 T 0 85 Z"
        />
      </path>
      <path fill="url(#waveLinear)" opacity="0.60">
        <animate
          attributeName="d"
          dur="20s"
          repeatCount="indefinite"
          keyTimes="0;0.333;0.667;1"
          calcmod="spline"
          keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
          begin="-10s"
          values="M0 0 L 854 0 L 854 90 Q 640.5 125 427 95 T 0 115 Z; M0 0 L 854 0 L 854 115 Q 640.5 75 427 110 T 0 80 Z; M0 0 L 854 0 L 854 85 Q 640.5 105 427 80 T 0 120 Z; M0 0 L 854 0 L 854 90 Q 640.5 125 427 95 T 0 115 Z"
        />
      </path>
    </g>

    <!-- Table Structure: Outer border and vertical dividing grid lines -->
    <rect x="0.5" y="0.5" width="853" height="129" fill="none" stroke="#30363D" stroke-width="1" />
    <line x1="195" y1="0" x2="195" y2="130" stroke="#30363D" stroke-width="1" />
    <line x1="645" y1="0" x2="645" y2="130" stroke="#30363D" stroke-width="1" />

    <!--
      1. LEFT SECTION: Stack Overflow Badge
      Hot pink background badge with white logo and bold typography
    -->
    <g transform="translate(18, 47)">
      <a xlink:href="https://stackoverflow.com/users/14017023/joel-t" target="_blank">
        <rect width="160.25" height="36" rx="3" fill="#FF00FF" />
        <g fill="#FFFFFF">
          <!-- Stack Overflow Vector Icon -->
          <svg x="10" y="9" width="18" height="18" viewBox="0 0 24 24">
            <path fill="#FFFFFF" d="M15.725 0l-1.72 1.277 6.39 8.588 1.716-1.277L15.725 0zm-3.94 3.418l-1.369 1.644 8.225 6.85 1.369-1.644-8.225-6.85zm-3.15 4.465l-.905 1.94 9.702 4.517.904-1.94-9.701-4.517zm-1.85 4.86l-.44 2.093 10.473 2.201.44-2.092-10.473-2.203zM1.89 15.47V24h19.19v-8.53h-2.133v6.397H4.021v-6.396H1.89zm4.265 2.133v2.13h10.66v-2.13H6.154Z"/>
          </svg>
          <text x="96" y="23" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="11.5" letter-spacing="0.5">STACKOVERFLOW</text>
        </g>
      </a>
    </g>

    <!--
      2. CENTER SECTION: Animated Typing Banner
      Sequentially types, holds, and erases 3 titles in cyan monospace font
    -->
    <g transform="translate(205, 0)">
      <!-- Line 1 -->
      <path id="typePath0">
        <animate id="t0" attributeName="d" begin="0s;t2.end" dur="5000ms" fill="remove"
          values="m0,65 h0 ; m0,65 h430 ; m0,65 h430 ; m0,65 h0" keyTimes="0;0.64;0.84;1" />
      </path>
      <text class="mono-text" dominant-baseline="middle" x="50%" text-anchor="middle">
        <textPath xlink:href="#typePath0">AZURE INFRASTRUCTURE EXPERT</textPath>
      </text>

      <!-- Line 2 -->
      <path id="typePath1">
        <animate id="t1" attributeName="d" begin="t0.end" dur="5000ms" fill="remove"
          values="m0,65 h0 ; m0,65 h430 ; m0,65 h430 ; m0,65 h0" keyTimes="0;0.64;0.84;1" />
      </path>
      <text class="mono-text" dominant-baseline="middle" x="50%" text-anchor="middle">
        <textPath xlink:href="#typePath1">FULL-STACK ENGINEERING | AI/ML BUILDING</textPath>
      </text>

      <!-- Line 3 -->
      <path id="typePath2">
        <animate id="t2" attributeName="d" begin="t1.end" dur="5000ms" fill="remove"
          values="m0,65 h0 ; m0,65 h430 ; m0,65 h430 ; m0,65 h0" keyTimes="0;0.64;0.84;1" />
      </path>
      <text class="mono-text" dominant-baseline="middle" x="50%" text-anchor="middle">
        <textPath xlink:href="#typePath2">ROBOTICS DEVELOPMENT | SOFTWARE ARCHITECTURE</textPath>
      </text>
    </g>

    <!--
      3. RIGHT SECTION: Total Contributions Stats Card
      Dark card framed by cyan border showing contributions count and date range
    -->
    <g transform="translate(660, 26)">
      <!-- Card Container with subtle backdrop -->
      <rect width="176" height="78" rx="4.5" fill="#0D1117" stroke="#00FFFF" stroke-width="1.2" />

      <!-- Contribution metric details -->
      <text x="88" y="32" text-anchor="middle" class="stat-num">429</text>
      <text x="88" y="51" text-anchor="middle" class="stat-label">Total Contributions</text>
      <text x="88" y="68" text-anchor="middle" class="stat-range">Oct 13, 2021 - Present</text>
    </g>

  </g>
</svg>
